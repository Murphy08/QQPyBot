name: Publish to PyPI
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check SemVer and package name
        run: |
          python -c 'import os, re, tomllib; version=tomllib.load(open("pyproject.toml","rb"))["project"]["version"]; assert re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version) and os.environ["GITHUB_REF"] == f"refs/tags/v{version}"'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m pip wheel --no-deps -w dist .
      - run: python -m pip install "setuptools>=77"
      - run: python -c 'from setuptools.build_meta import build_sdist; build_sdist("dist")'
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/QQPyBot/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
